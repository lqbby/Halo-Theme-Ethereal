apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: Ethereal
spec:
  displayName: Ethereal
  author:
    name: 楠南NanNan
    website: https://www.nanzhiy.cn
  description: 一款基于 Fuwari 二次开发，为 Halo 打造的 Fuwari 风格增强型主题。
  logo: /themes/Ethereal/assets/images/favicon-light-192.png
  homepage: https://github.com/AloneNanNan/halo-theme-ethereal#readme
  repo: https://github.com/AloneNanNan/halo-theme-ethereal
  issues: https://github.com/AloneNanNan/halo-theme-ethereal/issues
  customTemplates:
    page:
      - name: "朋友圈"
        description: "朋友圈页面（在主题设置的「扩展页面 → 朋友圈页面」中配置）"
        file: "friends.html"
      - name: "心愿便签"
        description: "心愿墙页面（需安装心愿便签插件）"
        file: "wishes.html"
      - name: "时间轴"
        description: "时间轴页面（在主题设置的「扩展页面 → 时间轴页面」中配置）"
        file: "timeline.html"
      - name: "技能"
        description: "技能页面（在主题设置的「扩展页面 → 技能页面」中配置）"
        file: "skills.html"
      - name: "关于页面"
        description: "关于页面（在主题设置的「扩展页面 → 关于页面」中配置）"
        file: "about.html"
      - name: "打赏页面"
        description: "打赏页面（在主题设置的「扩展页面 → 打赏页面」中配置）"
        file: "reward.html"
      # ⚠️ 以下 3 项为本地魔改独有（上游 v2.0.0 无），合并时从本地 1.5.66 迁入。
      - name: "博客日志"
        description: "博客更新日志页面（页面内容在主题设置「博客更新日志页面」中配置）"
        file: "blog-changelog.html"
      - name: "系列"
        description: "文章系列聚合页（需安装 Ethereal 配套插件；文章填 series/seriesOrder 注解）"
        file: "series.html"
      - name: "数据看板"
        description: "站点数据统计看板（需安装 data-statistics 插件；模块显隐在主题设置「扩展页面」中配置）"
        file: "statistics.html"
  settingName: "Ethereal-setting"
  configMapName: "Ethereal-configMap"
  version: "2.0.2"
  requires: ">=2.25.0"
  license:
    - name: "MIT"
      url: "https://github.com/AloneNanNan/halo-theme-ethereal/blob/main/LICENSE"
