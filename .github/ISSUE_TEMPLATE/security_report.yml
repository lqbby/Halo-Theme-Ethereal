name: 安全漏洞报告
description: 发现主题存在安全漏洞（如 XSS、信息泄露等）。注意：本表单会创建【公开】Issue，请勿填写利用细节；私密报告请走仓库 Security 页的私密报告入口
body:
  - type: markdown
    attributes:
      value: |
        ### 🔒 关于安全漏洞报告
        - ⚠️ **本表单提交后会创建公开 Issue，所有人可见，它不是私密报告渠道。**
        - 含利用细节（复现载荷 / PoC / 敏感数据）的报告，请改走 **GitHub 私密漏洞报告**：仓库 **Security** 标签页 → **Report a vulnerability**（只有仓库维护者可见）；新建 Issue 页顶部的「🔒 安全漏洞私密报告」链接也可直达
        - 若私密入口不可用，可用本表单**仅登记**漏洞类型与受影响版本，**不要**填写复现细节；维护者看到后会与你约定私密沟通方式
        - **请勿**在公开渠道（Issues、交流群、博客评论区）描述漏洞细节，以免影响尚未升级的用户
        - 维护者会尽快评估处理；在此之前请不要公开利用该漏洞

  - type: dropdown
    id: vuln-type
    attributes:
      label: 🕳️ 漏洞类型
      options:
        - XSS（跨站脚本注入）
        - CSRF（跨站请求伪造）
        - 信息泄露（敏感数据暴露）
        - 恶意代码 / 供应链风险
        - 依赖组件漏洞
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 受影响版本
      description: 出现漏洞的主题版本及 Halo 版本
      placeholder: 例如：主题 1.0.8 / Halo 2.25.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 漏洞描述
      description: 描述漏洞的具体表现与触发条件
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 复现步骤（仅限不含利用细节时填写）
      description: 本 Issue 公开可见：含请求载荷 / PoC 的复现步骤请勿贴在这里，改走上方私密报告入口提交；此处只可写不含可利用细节的概括性描述
      render: markdown

  - type: textarea
    id: impact
    attributes:
      label: 💥 影响范围
      description: 该漏洞可能造成的影响（例如：可导致什么后果）

  - type: textarea
    id: fix
    attributes:
      label: 🛠️ 建议的修复方案（可选）
      description: 若你已有修复思路或补丁，请在此说明
